<!DOCTYPE html>
<html>
<head>
  <title>My To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0b2545; color: white; max-width: 420px; margin: 60px auto; padding: 0 16px; }
    h1 { color: #4de1ff; }
    input { padding: 10px; width: 65%; font-size: 16px; }
    button { padding: 10px 14px; font-size: 16px; cursor: pointer; }
    li { margin: 10px 0; font-size: 18px; }
  </style>
</head>
<body>
  <h1>My To-Do List</h1>
  <input id="taskInput" placeholder="Add a task">
  <button onclick="addTask()">Add</button>
  <ul id="taskList"></ul>

  <script>
    var tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); }

function render() {
  var list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.forEach(function (text, i) {
    var li = document.createElement("li");
    li.textContent = text;
    li.onclick = function () { tasks.splice(i, 1); save(); render(); };
    list.appendChild(li);
  });
}

function addTask() {
  var input = document.getElementById("taskInput");
  var text = input.value;
  if (text === "") { return; }
  tasks.push(text);
  save();
  render();
  input.value = "";
}

render();
  </script>
</body>
</html>
